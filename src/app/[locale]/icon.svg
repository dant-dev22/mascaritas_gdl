<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="favMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a8a55"/>
      <stop offset="100%" stop-color="#0f5c3a"/>
    </linearGradient>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef5a66"/>
      <stop offset="100%" stop-color="#c0262e"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="245" fill="#0a3d27"/>

  <!-- Mask head -->
  <path
    d="M 250 70 C 340 70, 390 140, 390 235 C 390 300, 365 340, 330 365 L 330 400 L 250 410 L 170 400 L 170 365 C 135 340, 110 300, 110 235 C 110 140, 160 70, 250 70 Z"
    fill="url(#favMaskGrad)"
    stroke="#062819"
    stroke-width="4"
  />

  <!-- Center seam -->
  <line x1="250" y1="75" x2="250" y2="405" stroke="#062819" stroke-width="3" stroke-linecap="round"/>

  <!-- Red eye-mask -->
  <path
    d="M 140 180 C 140 155, 170 143, 205 148 C 228 151, 242 165, 250 178 C 258 165, 272 151, 295 148 C 330 143, 360 155, 360 180 C 360 208, 342 224, 312 229 C 285 233, 260 222, 250 210 C 240 222, 215 233, 188 229 C 158 224, 140 208, 140 180 Z"
    fill="url(#favRedGrad)"
    stroke="#7a1820"
    stroke-width="3"
  />

  <!-- Nose -->
  <path d="M 225 212 L 250 275 L 275 212 Z" fill="#0f5c3a" stroke="#062819" stroke-width="2.5"/>

  <!-- Eyes -->
  <ellipse cx="200" cy="188" rx="26" ry="19" fill="#ffffff" stroke="#062819" stroke-width="2.5"/>
  <ellipse cx="300" cy="188" rx="26" ry="19" fill="#ffffff" stroke="#062819" stroke-width="2.5"/>

  <!-- Mouth -->
  <path
    d="M 155 275 C 155 257, 192 250, 250 253 C 308 250, 345 257, 345 275 L 345 340 C 345 358, 308 368, 250 371 C 192 368, 155 358, 155 340 Z"
    fill="url(#favRedGrad)"
    stroke="#7a1820"
    stroke-width="3"
  />

  <!-- Mouth interior -->
  <path
    d="M 172 286 C 195 280, 222 277, 250 280 C 278 277, 305 280, 328 286 L 328 330 C 305 337, 278 339, 250 338 C 222 339, 195 337, 172 330 Z"
    fill="#0a0a0a"
  />

  <!-- Upper teeth -->
  <g fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5">
    <path d="M 172 286 L 183 320 L 194 286 Z"/>
    <path d="M 194 286 L 205 326 L 216 286 Z"/>
    <path d="M 216 286 L 227 329 L 238 286 Z"/>
    <path d="M 238 286 L 250 330 L 262 286 Z"/>
    <path d="M 262 286 L 273 329 L 284 286 Z"/>
    <path d="M 284 286 L 295 326 L 306 286 Z"/>
    <path d="M 306 286 L 317 320 L 328 286 Z"/>
  </g>

  <!-- Lower teeth -->
  <g fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5">
    <path d="M 188 330 L 199 308 L 210 330 Z"/>
    <path d="M 210 330 L 221 305 L 232 330 Z"/>
    <path d="M 232 330 L 250 303 L 268 330 Z"/>
    <path d="M 268 330 L 279 305 L 290 330 Z"/>
    <path d="M 290 330 L 301 308 L 312 330 Z"/>
  </g>
</svg>
